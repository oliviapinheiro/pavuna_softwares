<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar nova senha · Pavuna Softwares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <div vw class="enabled">
    <div vw-access-button class="active" title="Ativar VLibras (tradução para Libras)"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>if (window.VLibras) { new window.VLibras.Widget('https://vlibras.gov.br/app'); }</script>

<main class="auth-wrap">
  <div class="auth-brand">
    <div class="auth-brand-icon">
      <img src="Pavuna Softwares/SENAI_Port_com_assinatura_cor.png" alt="Logotipo do SENAI">
      <img src="Pavuna Softwares/SESI_Port_com_assinatura_cor.png" alt="Logotipo do SESI">
    </div>
    <div class="auth-brand-text">
      <strong>NÚCLEO ESCOLAR DA PAVUNA SOFTWARES</strong>
      <span>Controle de Turmas &amp; Instrutores</span>
    </div>
  </div>

  <div class="auth-card">
    <h1>Criar nova senha</h1>
    <p class="auth-sub">Escolha uma nova senha para a sua conta.</p>

    <div class="auth-alert" id="redefinirAlerta" role="alert"></div>

    <form id="formRedefinir" novalidate>
      <div class="auth-field">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" autocomplete="new-password" required aria-required="true" aria-describedby="novaSenha-dica novaSenha-erro">
        <span class="auth-hint" id="novaSenha-dica">Mínimo de 8 caracteres.</span>
        <span class="auth-error" id="novaSenha-erro"></span>
      </div>
      <div class="auth-field">
        <label for="confirmarNovaSenha">Confirmar nova senha</label>
        <input type="password" id="confirmarNovaSenha" autocomplete="new-password" required aria-required="true">
        <span class="auth-error" id="confirmarNovaSenha-erro"></span>
      </div>
      <button type="submit" class="auth-submit">Salvar nova senha</button>
    </form>

    <p class="auth-footer"><a href="login.html">Voltar para o login</a></p>
  </div>
</main>

<script src="auth.js"></script>
</body>
</html>
